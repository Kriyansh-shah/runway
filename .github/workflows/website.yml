# Builds the website (landing page, privacy policy, support page and the
# web app under /app/) and publishes it to GitHub Pages on every push to
# main. Lives at https://kriyansh-shah.github.io/runway/.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: flutter pub get
      - run: flutter test
      - run: scripts/build_site.sh
        env:
          BASE_HREF: /runway/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
